# .github/workflows/ci.yml

name: Java CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t ghcr.io/kongaradeepthi/student-grade-app:1.0 .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/kongaradeepthi/student-grade-app:1.0
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
